name: No game data

# Every push and pull request, whatever it changes (documents too), unlike the
# builds in ci.yml.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

# As in ci.yml: a newer push cancels the older run, except on main, where each
# commit has a group of its own, so none is cancelled while it waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  game-data:
    name: No game data
    # Pull requests only from forks: a branch of this repository has already
    # been checked on its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tracked files
        run: python3 tools/check_game_data.py
