name: Package

# Builds the installer packages (see docs/packaging.md): the runtime, the
# recompiler, the installer, which builds each game on the player's machine
# from their own disc image, and the launcher players open, OpenGP, which
# builds the games with the installer's code. No game code or data is in them.
#
# It runs for every version tag and by hand (Actions > Package > Run workflow,
# or `gh workflow run package.yml --ref <branch>`), and on main and pull
# requests only when the build itself changes; CI builds and tests every other
# change. Run it by hand on the release commit before tagging.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Not checked for tags: every tag runs.
    paths:
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - 'tools/installer/**'
      - 'tools/package_probe.py'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - 'tools/installer/**'
      - 'tools/package_probe.py'
      - '.github/workflows/package.yml'
  workflow_dispatch:
    inputs:
      launcher_ref:
        description: "The launcher's branch, tag or commit (default: LAUNCHER_REF)"
        required: false
        type: string

env:
  # The launcher release the packages carry, from OpenGP-dev/opengp-launcher,
  # built against this checkout of OpenGP. A run by hand can name another.
  LAUNCHER_REF: v1.0.0
  # The Qt the launcher is built with, which the packages carry and
  # THIRD-PARTY-NOTICES.md names: change both together.
  QT_VERSION: '6.10.3'

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A version tag must name the version the packages are built as.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $project = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(OpenGP VERSION ([0-9.]+)').Groups[1].Value
          if (($env:GITHUB_REF_NAME -replace '^v', '') -ne $project) {
            throw "The tag $env:GITHUB_REF_NAME does not match the project version $project in CMakeLists.txt"
          }
      # While the launcher's repository is private, this workflow's own token
      # can't read it: a token that can is a secret (a Dependabot secret too, as
      # Dependabot's pull requests get only those). Without it, as in pull
      # requests from forks, which get no secrets, the launcher is checked out
      # with the workflow's own token, which can read it once it is public.
      - name: Check for the launcher's token
        shell: pwsh
        env:
          LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
        run: |
          if (-not $env:LAUNCHER_TOKEN) {
            Write-Output "::notice title=No LAUNCHER_TOKEN::No LAUNCHER_TOKEN is set, so the launcher is checked out with this workflow's own token, which can read OpenGP-dev/opengp-launcher only once that repository is public (see docs/packaging.md, Building the package)."
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      # The compiler the package's runtime is built with must be the one its
      # installer downloads: the version and hash pinned in cmake/package.cmake.
      - name: Read the pinned llvm-mingw
        id: pin
        shell: pwsh
        run: |
          $text = Get-Content cmake/package.cmake -Raw
          $version = [regex]::Match($text, 'OPENGP_LLVM_MINGW_VERSION (\d+)').Groups[1].Value
          $sha = [regex]::Match($text, 'OPENGP_LLVM_MINGW_SHA256 ([0-9a-f]+)').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "dir=llvm-mingw-$version-ucrt-x86_64" >> $env:GITHUB_OUTPUT
          $project = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(OpenGP VERSION ([0-9.]+)').Groups[1].Value
          "project=$project" >> $env:GITHUB_OUTPUT
      - name: Cache llvm-mingw
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\llvm-mingw
          # The pinned SHA-256 is part of the key, so a cached toolchain is one
          # whose download was checked against it.
          key: llvm-mingw-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}
      - name: Download llvm-mingw
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = "${{ steps.pin.outputs.dir }}"
          curl.exe -fL --retry 3 -o llvm-mingw.zip "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ steps.pin.outputs.version }}/$dir.zip"
          if ((Get-FileHash llvm-mingw.zip -Algorithm SHA256).Hash.ToLower() -ne "${{ steps.pin.outputs.sha256 }}") { throw "llvm-mingw SHA-256 mismatch" }
          New-Item -ItemType Directory -Force C:\llvm-mingw | Out-Null
          tar.exe -xf llvm-mingw.zip -C C:\llvm-mingw
      - name: Build, test and lay out the package
        shell: pwsh
        env:
          OPENGP_LLVM_MINGW: C:/llvm-mingw/${{ steps.pin.outputs.dir }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install ninja==1.13.2
          cmake --preset package-windows
          cmake --build --preset package-windows
          ctest --preset package-windows
          cmake --install build/package-windows
          python tools/package_probe.py out/OpenGP-windows-x64 build/package-windows --cxx "$env:OPENGP_LLVM_MINGW/bin/x86_64-w64-mingw32-clang++.exe"
      - name: Check out the launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenGP-dev/opengp-launcher
          ref: ${{ inputs.launcher_ref || env.LAUNCHER_REF }}
          path: launcher
          token: ${{ secrets.LAUNCHER_TOKEN || github.token }}
          submodules: false
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      # With clang-cl and the MSVC Qt, in the environment CI's Windows job
      # uses (tools/devshell.ps1); not llvm-mingw, which is for the games.
      - name: Build, test and install the launcher
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./tools/devshell.ps1
          cmake -S launcher -B build/launcher -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DOPENGP_SOURCE_DIR=${{ github.workspace }}" "-DLAUNCHER_DEV_HOME=" "-DLAUNCHER_NEWS_URL="
          cmake --build build/launcher
          ctest --test-dir build/launcher --output-on-failure
          # A full path: Qt's deployment fails on a relative prefix.
          cmake --install build/launcher --prefix "${{ github.workspace }}/out/OpenGP-windows-x64"
      # In a copy, as the launcher writes user/ and build/ where it runs, and
      # with only the package's Qt, not the one installed above.
      - name: Check the launcher in the package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $launcher = [regex]::Match((Get-Content launcher/CMakeLists.txt -Raw), 'project\(OpenGPLauncher VERSION ([0-9.]+)').Groups[1].Value
          $expected = "OpenGP Launcher $launcher (OpenGP ${{ steps.pin.outputs.project }})"
          Copy-Item -Recurse out/OpenGP-windows-x64 $env:RUNNER_TEMP
          Set-Location (Join-Path $env:RUNNER_TEMP OpenGP-windows-x64)
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not $_.StartsWith($env:QT_ROOT_DIR) }) -join ';'
          # Piped, so that PowerShell waits for the windowed program.
          $version = (./OpenGP.exe --version | Out-String).Trim()
          if ($version -ne $expected) { throw "OpenGP --version printed '$version', not '$expected'" }
          ./OpenGP.exe --smoke-test | Out-Host
      - name: Archive the package
        shell: pwsh
        run: Compress-Archive -Path out/OpenGP-windows-x64 -DestinationPath "OpenGP-${{ steps.pin.outputs.project }}-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: OpenGP-windows-x64
          path: OpenGP-*-windows-x64.zip

  linux:
    name: Linux package
    # The oldest supported runner, so the package links on older distributions
    # too (glibc 2.35, libstdc++ from GCC 12).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A version tag must name the version the packages are built as.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the project version $version in CMakeLists.txt" >&2
            exit 1
          fi
      # While the launcher's repository is private, this workflow's own token
      # can't read it: a token that can is a secret (a Dependabot secret too, as
      # Dependabot's pull requests get only those). Without it, as in pull
      # requests from forks, which get no secrets, the launcher is checked out
      # with the workflow's own token, which can read it once it is public.
      - name: Check for the launcher's token
        env:
          LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
        run: |
          if [ -z "$LAUNCHER_TOKEN" ]; then
            echo "::notice title=No LAUNCHER_TOKEN::No LAUNCHER_TOKEN is set, so the launcher is checked out with this workflow's own token, which can read OpenGP-dev/opengp-launcher only once that repository is public (see docs/packaging.md, Building the package)."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install GCC 12, Ninja and SDL3's dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y g++-12 ninja-build
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev
          libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev
      - name: Build, test and lay out the package
        run: |
          cmake --preset package-linux
          cmake --build --preset package-linux
          ctest --preset package-linux
          cmake --install build/package-linux
          python tools/package_probe.py out/OpenGP-linux-x64 build/package-linux --cxx g++-12
      - name: Check out the launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenGP-dev/opengp-launcher
          ref: ${{ inputs.launcher_ref || env.LAUNCHER_REF }}
          path: launcher
          token: ${{ secrets.LAUNCHER_TOKEN || github.token }}
          submodules: false
          persist-credentials: false
      # OpenGL's development files for Qt's CMake files, and the X11 libraries
      # Qt's xcb platform needs. The install copies the xcb-util ones
      # (libxcb-cursor0 to libxcb-util1) into the package, and stops without them.
      - name: Install what Qt needs
        run: >
          sudo apt-get install -y libgl1-mesa-dev libfontconfig1 libxkbcommon-x11-0 libx11-xcb1
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1
          libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          install-deps: false
          cache: true
      - name: Build, test and install the launcher
        run: |
          cmake -S launcher -B build/launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DOPENGP_SOURCE_DIR="${{ github.workspace }}" -DLAUNCHER_DEV_HOME= -DLAUNCHER_NEWS_URL=
          cmake --build build/launcher
          ctest --test-dir build/launcher --output-on-failure
          # A full path: Qt's deployment fails on a relative prefix.
          cmake --install build/launcher --prefix "${{ github.workspace }}/out/OpenGP-linux-x64"
      # In a copy, as the launcher writes user/ and build/ where it runs, and
      # with only the package's Qt, not the one installed above. There is no
      # display: the offscreen platform, which the package carries for this.
      - name: Check the launcher in the package
        run: |
          launcher=$(sed -n 's/^project(OpenGPLauncher VERSION \([0-9.]*\).*/\1/p' launcher/CMakeLists.txt)
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          expected="OpenGP Launcher $launcher (OpenGP $version)"
          cp -a out/OpenGP-linux-x64 "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP/OpenGP-linux-x64"
          if [ ! -f qt/plugins/platforms/libqoffscreen.so ]; then
            echo "The package has no offscreen platform plugin (qt/plugins/platforms/libqoffscreen.so)" >&2
            exit 1
          fi
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QML2_IMPORT_PATH
          printed=$(./OpenGP --version)
          if [ "$printed" != "$expected" ]; then
            echo "OpenGP --version printed '$printed', not '$expected'" >&2
            exit 1
          fi
          QT_QPA_PLATFORM=offscreen ./OpenGP --smoke-test
      - name: Archive the package
        run: |
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tar -czf "OpenGP-$version-linux-x64.tar.gz" -C out OpenGP-linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: OpenGP-linux-x64
          path: OpenGP-*-linux-x64.tar.gz

  macos:
    name: macOS package
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A version tag must name the version the packages are built as.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the project version $version in CMakeLists.txt" >&2
            exit 1
          fi
      # While the launcher's repository is private, this workflow's own token
      # can't read it: a token that can is a secret (a Dependabot secret too, as
      # Dependabot's pull requests get only those). Without it, as in pull
      # requests from forks, which get no secrets, the launcher is checked out
      # with the workflow's own token, which can read it once it is public.
      - name: Check for the launcher's token
        env:
          LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
        run: |
          if [ -z "$LAUNCHER_TOKEN" ]; then
            echo "::notice title=No LAUNCHER_TOKEN::No LAUNCHER_TOKEN is set, so the launcher is checked out with this workflow's own token, which can read OpenGP-dev/opengp-launcher only once that repository is public (see docs/packaging.md, Building the package)."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: brew install ninja
      - name: Build, test and lay out the package
        run: |
          cmake --preset package-macos
          cmake --build --preset package-macos
          ctest --preset package-macos
          cmake --install build/package-macos
          python tools/package_probe.py out/OpenGP-macos-arm64 build/package-macos --cxx clang++
      - name: Check out the launcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: OpenGP-dev/opengp-launcher
          ref: ${{ inputs.launcher_ref || env.LAUNCHER_REF }}
          path: launcher
          token: ${{ secrets.LAUNCHER_TOKEN || github.token }}
          submodules: false
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          arch: clang_64
          cache: true
      # Qt's deployment rewrites the libraries it copies into OpenGP.app, and
      # Apple silicon runs no code without a valid signature: the app is
      # signed again, ad hoc, after it (the launcher's install does it too).
      - name: Build, test and install the launcher
        run: |
          cmake -S launcher -B build/launcher -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DOPENGP_SOURCE_DIR="${{ github.workspace }}" -DLAUNCHER_DEV_HOME= -DLAUNCHER_NEWS_URL=
          cmake --build build/launcher
          ctest --test-dir build/launcher --output-on-failure
          # A full path: Qt's deployment fails on a relative prefix.
          cmake --install build/launcher --prefix "${{ github.workspace }}/out/OpenGP-macos-arm64"
          codesign --force --deep -s - out/OpenGP-macos-arm64/OpenGP.app
      # In a copy, as the launcher writes user/ and build/ where it runs, and
      # with only the package's Qt, not the one installed above.
      - name: Check the launcher in the package
        run: |
          launcher=$(sed -n 's/^project(OpenGPLauncher VERSION \([0-9.]*\).*/\1/p' launcher/CMakeLists.txt)
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          expected="OpenGP Launcher $launcher (OpenGP $version)"
          cp -a out/OpenGP-macos-arm64 "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP/OpenGP-macos-arm64"
          codesign --verify --deep --strict OpenGP.app
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH
          printed=$(OpenGP.app/Contents/MacOS/OpenGP --version)
          if [ "$printed" != "$expected" ]; then
            echo "OpenGP --version printed '$printed', not '$expected'" >&2
            exit 1
          fi
          OpenGP.app/Contents/MacOS/OpenGP --smoke-test
      - name: Archive the package
        run: |
          version=$(sed -n 's/^project(OpenGP VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          tar -czf "OpenGP-$version-macos-arm64.tar.gz" -C out OpenGP-macos-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: OpenGP-macos-arm64
          path: OpenGP-*-macos-arm64.tar.gz

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true
      - name: Upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Packages only ever go to a draft release: a published release keeps the
        # packages people have already downloaded and checked.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Release $TAG is already published; its packages are not replaced." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "OpenGP ${TAG#v}" --notes "See CHANGELOG.md."
          fi
          sha256sum OpenGP-* > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber OpenGP-* SHA256SUMS
