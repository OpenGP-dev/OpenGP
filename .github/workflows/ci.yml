name: CI

# Builds and tests every push to main and every pull request, and checks that
# no game data is committed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ccache (installed by ccache-action) keeps the compiled objects from the last
# run of each job, so a push recompiles only what it changed. CMake takes the
# launcher from these variables. Precompiled headers (SDL3's and glslang's) are
# turned off because ccache can't cache what uses them.
env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  game-data:
    name: No game data
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tracked files
        run: python3 tools/check_game_data.py

  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            os: ubuntu-24.04
          - compiler: clang
            cc: clang
            cxx: clang++
            os: ubuntu-24.04
          # The oldest supported compiler, and the system compiler of Debian 12,
          # which the Linux installer package would use.
          - compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            os: ubuntu-22.04
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # SDL3 (fetched and built by the renderer) needs X11 and audio headers.
      - name: Install Ninja and SDL3's dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.compiler == 'gcc-12' && 'g++-12' || '' }}
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libasound2-dev libpulse-dev
      # One cache per job. No key may start with another, as the cache is
      # restored from the newest key that starts with this one.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          install: binary
          evict-old-files: job
      - name: Configure
        run: cmake --preset default -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
      - name: Build
        run: cmake --build --preset default
      - name: Test
        run: ctest --preset default

  macos:
    name: macOS (Apple Clang)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Ninja
        run: brew install ninja
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: macos-15
          install: binary
          evict-old-files: job
      - name: Configure
        run: cmake --preset default -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
      - name: Build
        run: cmake --build --preset default
      - name: Test
        run: ctest --preset default

  windows:
    name: Windows (clang-cl)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: windows-clang-cl
          install: binary
          evict-old-files: job
      # tools/devshell.ps1 is the same environment setup used for local builds:
      # the Visual Studio x64 environment plus LLVM's clang-cl (preinstalled on
      # the runner). Each step is a new shell, so everything runs in one step.
      # ccache can't cache objects whose debug information goes to a separate
      # PDB (/Zi), so it goes into the objects (/Z7).
      - name: Configure, build and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true  # stop on the first failing command
          . ./tools/devshell.ps1
          cmake --preset clang-cl -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build --preset clang-cl
          ctest --preset clang-cl
