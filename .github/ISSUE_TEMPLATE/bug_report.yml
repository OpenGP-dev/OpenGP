name: Bug report
description: Something in OpenGP doesn't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never attach game files (disc images, main.dol, recompiled code, or
        anything from the games): OpenGP can't accept them. The reports below are fine.
  - type: input
    id: version
    attributes:
      label: OpenGP version
      description: "`opengp-mkgp2 --version` prints it."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Mario Kart Arcade GP 2
        - Mario Kart Arcade GP
        - Both
        - The installer
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and version, CPU and GPU.
      placeholder: "Windows 11 24H2, Ryzen 7 7800X3D, RTX 4070"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed OpenGP
      options:
        - Installer package
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Start a Grand Prix with Mario
        2. ...
  - type: textarea
    id: reports
    attributes:
      label: Reports
      description: |
        If the game froze, attach `user/hang-report.txt`.
        Paste the console output if there is any. Remove anything private (your user name in paths).
  - type: checkboxes
    id: no-game-data
    attributes:
      label: No game files
      options:
        - label: I have not attached any files from the games.
          required: true
