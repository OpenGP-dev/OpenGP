# Keeps the GitHub Actions the workflows use (pinned by commit) up to date.
# The native dependencies (SDL3, Dear ImGui, glslang, SPIRV-Cross, llvm-mingw,
# doctest, toml++) are pinned by hash in the CMake files and updated by hand.
# Its pull requests run the workflows with Dependabot secrets only, so the
# package workflow's LAUNCHER_TOKEN, needed while the launcher's repository is
# private, is one too (docs/packaging.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
